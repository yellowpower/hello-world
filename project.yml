# XcodeGen spec — regenerate the Xcode project deterministically with:
#   brew install xcodegen && xcodegen generate
# The .xcodeproj itself is intentionally NOT committed; this file is the source
# of truth so the project stays merge-friendly and reproducible.
name: BedtimeBooks
options:
  bundleIdPrefix: com.bedtimebooks
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # Local cross-platform logic + tests (Foundation only).
  BedtimeBooksCore:
    path: Core
  # EPUB/DOCX are ZIP containers; ZIPFoundation unzips them. The XML/XHTML
  # parsing itself lives in BedtimeBooksCore (Foundation XMLParser), so no HTML
  # or Markdown third-party package is needed.
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"

targets:
  BedtimeBooks:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BedtimeBooks
      # M2: uncomment once Scripts/build_sherpa_xcframework.sh has copied the
      # upstream Swift wrapper into Vendor/. It references C symbols from the
      # xcframeworks, so only compile it when those are linked.
      # - path: Vendor/SherpaOnnx.swift
    info:
      path: BedtimeBooks/Support/Info.plist
      properties:
        CFBundleDisplayName: Bedtime Books
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Background + lock-screen audio playback.
        UIBackgroundModes:
          - audio
        # Document types the app can open / import.
        UTImportedTypeDeclarations: []
        CFBundleDocumentTypes:
          - CFBundleTypeName: Supported Documents
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - net.daringfireball.markdown
              - com.adobe.pdf
              - org.idpf.epub-container
              - org.openxmlformats.wordprocessingml.document
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bedtimebooks.app
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
        # M2: add SHERPA_ENABLED here to compile the neural Kokoro engine.
        # SWIFT_ACTIVE_COMPILATION_CONDITIONS: SHERPA_ENABLED
    dependencies:
      - package: BedtimeBooksCore
      - package: ZIPFoundation
      # M2 — neural Kokoro voice. After running
      # Scripts/build_sherpa_xcframework.sh, the xcframeworks + SherpaOnnx.swift
      # land in Vendor/. Uncomment the frameworks below AND add SHERPA_ENABLED to
      # SWIFT_ACTIVE_COMPILATION_CONDITIONS (see the commented setting above) to
      # compile NeuralTTSEngine; without this the app builds with the system
      # voice only.
      # - framework: Vendor/sherpa-onnx.xcframework
      #   embed: true
      # - framework: Vendor/onnxruntime.xcframework
      #   embed: true

  BedtimeBooksTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/BedtimeBooksTests
    dependencies:
      - target: BedtimeBooks
      - package: BedtimeBooksCore

schemes:
  BedtimeBooks:
    build:
      targets:
        BedtimeBooks: all
        BedtimeBooksTests: [test]
    test:
      targets:
        - BedtimeBooksTests
