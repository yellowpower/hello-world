# XcodeGen spec — regenerate the Xcode project deterministically with:
#   brew install xcodegen && xcodegen generate
# The .xcodeproj itself is intentionally NOT committed; this file is the source
# of truth so the project stays merge-friendly and reproducible.
name: BedtimeBooks
options:
  bundleIdPrefix: com.bedtimebooks
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # Local cross-platform logic + tests (Foundation only).
  BedtimeBooksCore:
    path: Core
  # M3 document-format dependencies (already wired so they're ready to use).
  SwiftMarkdown:
    url: https://github.com/apple/swift-markdown
    from: "0.4.0"
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
  SwiftSoup:
    url: https://github.com/scinfu/SwiftSoup
    from: "2.7.0"

targets:
  BedtimeBooks:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: BedtimeBooks
    info:
      path: BedtimeBooks/Support/Info.plist
      properties:
        CFBundleDisplayName: Bedtime Books
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Background + lock-screen audio playback.
        UIBackgroundModes:
          - audio
        # Document types the app can open / import.
        UTImportedTypeDeclarations: []
        CFBundleDocumentTypes:
          - CFBundleTypeName: Supported Documents
            LSHandlerRank: Alternate
            LSItemContentTypes:
              - public.plain-text
              - net.daringfireball.markdown
              - com.adobe.pdf
              - org.idpf.epub-container
              - org.openxmlformats.wordprocessingml.document
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bedtimebooks.app
        TARGETED_DEVICE_FAMILY: "1,2"   # iPhone + iPad
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: BedtimeBooksCore
      - package: SwiftMarkdown
        product: Markdown
      - package: ZIPFoundation
      - package: SwiftSoup
      # M2: after running Scripts/build_sherpa_xcframework.sh, vendor these and
      # uncomment to enable the neural (Kokoro) engine:
      # - framework: Vendor/sherpa-onnx.xcframework
      #   embed: true
      # - framework: Vendor/onnxruntime.xcframework
      #   embed: true

  BedtimeBooksTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/BedtimeBooksTests
    dependencies:
      - target: BedtimeBooks
      - package: BedtimeBooksCore

schemes:
  BedtimeBooks:
    build:
      targets:
        BedtimeBooks: all
        BedtimeBooksTests: [test]
    test:
      targets:
        - BedtimeBooksTests
